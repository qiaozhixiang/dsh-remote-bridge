# DSH 远程桥接 —— 分发包默认配置
# 安装后请按需修改：白名单 QQ 号、DSH 地址、隧道设置。

[plugin]
enabled = true
config_version = "1.6.0"

[connection]
# DSH Web 地址；本机默认 3080，改动后需与 DSH 实际监听端口一致
base_url = "http://127.0.0.1:3080"
token = ""
timeout_seconds = 12.0
verify_tls = true
# 只有访问公网隧道地址时才需要；内网直连会自动忽略，留空即不使用代理
http_proxy = ""

[behavior]
page_size = 60
max_sessions = 300
stream_buffer_size = 600
allow_write = true

[whitelist]
# 只有这些 QQ 号能用 /dsh 命令；留空表示没有预置成员
enabled = true
qq_numbers = []
# 管理员可以用 /dsh allow / /dsh deny 管理白名单
admins = []
# 非白名单用户的 /dsh 消息静默忽略
ignore_others = true
reply_timeout_seconds = 180
max_reply_chars = 1200

[tunnel]
enabled = true
auto_start = false
cloudflared_path = ""
target_url = ""
# 内网通道地址；留空则读 DSH access.json 的 listen 地址（默认 192.168.x.x:3088）
lan_url = ""
# 留 0 表示自动跟随 access.json 的端口
lan_port = 0
proxy_port = 3081
startup_timeout_seconds = 45

[files]
# 自动把回复里生成的文件发到当前对话
enabled = true
auto_send = true
max_files = 5
max_size_mb = 25
# 只允许发送这些目录下的文件；留空表示不限（仍会拒绝 .ssh/.git 等敏感目录）
allowed_roots = []
